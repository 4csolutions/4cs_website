# Coolify-friendly docker-compose for the 4C Solutions website stack.
#
# Deploy this in Coolify as a "Docker Compose" application:
#   1. Create a new resource -> Docker Compose -> point to this repo.
#   2. Set the env vars listed under each service.
#   3. Configure persistent volumes for `mongo_data` and `backend_uploads`.
#   4. Set up your Coolify domain pointing to the frontend container on port 80.
#
# Locally, this runs on: http://localhost:5005

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: 4cs_website
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/4cs_website
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-4cs_super_secret_session_token}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-mujeerhashmi@4csolutions.in}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5005:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  backend_uploads:
