server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Support client-side React Router reloads
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy /sitemap.xml directly to the backend sitemap endpoint
  location = /sitemap.xml {
    proxy_pass http://backend:5000/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Enable browser caching for static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
  }

  # Reverse Proxy for API endpoints
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Reverse Proxy for dynamic uploaded assets
  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Healthcheck endpoint for container orchestration
  location /healthz {
    access_log off;
    return 200 "OK";
  }
}
